server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths load index.html so client-side routes work on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # OCR engine files are large and never change between builds of the same version.
  location /ocr/ {
    types { application/wasm wasm; application/javascript js; }
    expires 30d;
    add_header Cache-Control "public";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
