version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: reportsetu-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: reportsetu
      POSTGRES_PASSWORD: reportsetu
      POSTGRES_DB: reportsetu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reportsetu -d reportsetu']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reportsetu-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reportsetu-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://reportsetu:reportsetu@postgres:5432/reportsetu?schema=public
      - JWT_ACCESS_SECRET=reportsetu_jwt_access_super_secret_key_32_characters_min
      - JWT_REFRESH_SECRET=reportsetu_jwt_refresh_super_secret_key_32_characters_min
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - CORS_ORIGIN=http://localhost:5173
      - AI_PROVIDER=mock
      - LOG_LEVEL=info
      - SMS_DEV_CODE=123456
      - ML_SERVICE_URL=http://ml-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reportsetu-network

  ml-service:
    build:
      context: ./Machine learning
      dockerfile: Dockerfile
    container_name: reportsetu-ml
    restart: unless-stopped
    ports:
      - '8001:8001'
    environment:
      - PORT=8001
      - PYTHONUNBUFFERED=1
    networks:
      - reportsetu-network

volumes:
  postgres_data:
    driver: local

networks:
  reportsetu-network:
    driver: bridge
